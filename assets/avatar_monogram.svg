<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#161f30" />
      <stop offset="60%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#05070a" />
    </radialGradient>

    <!-- Foreground Gradient -->
    <linearGradient id="glyphGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0071e3" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glass Rim Stroke Gradient -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0071e3" stop-opacity="0.05" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="256" fill="url(#bgGlow)" />

  <!-- Subtle Outer Precision Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#rimGrad)" stroke-width="3" />

  <!-- Subtle Radial Grid Circles -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1" stroke-dasharray="4 8" />
  <circle cx="256" cy="256" r="140" fill="none" stroke="#38bdf8" stroke-opacity="0.06" stroke-width="1" />

  <!-- Geometric "M" Developer Glyph -->
  <!-- Left Pillar -->
  <path d="M 128 352 L 128 176 C 128 165 137 156 148 156 L 176 156 C 187 156 196 165 196 176 L 196 352 C 196 361 189 368 180 368 L 144 368 C 135 368 128 361 128 352 Z"
        fill="url(#glyphGrad)" filter="url(#glow)" />

  <!-- Right Pillar -->
  <path d="M 316 176 C 316 165 325 156 336 156 L 364 156 C 375 156 384 165 384 176 L 384 352 C 384 361 377 368 368 368 L 332 368 C 323 368 316 361 316 352 Z"
        fill="url(#glyphGrad)" filter="url(#glow)" />

  <!-- Center Dynamic Vertex / Chevron -->
  <path d="M 196 182 L 244 266 C 250 276 262 276 268 266 L 316 182 L 316 232 L 272 306 C 264 320 248 320 240 306 L 196 232 Z"
        fill="#ffffff" fill-opacity="0.95" />

  <!-- Terminal Dot Accent -->
  <circle cx="256" cy="358" r="9" fill="#38bdf8" filter="url(#glow)" />
</svg>
